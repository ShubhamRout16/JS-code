<script>
  // document.getElementById('owl').onclick = function(){
  //   alert("owl clicked");

  // attachEvent() -> earlier used on internet explorer
  // jQuery  -on 

  // document.getElementById('owl').addEventListener('click',function(e){

  // Note :- events of js which are asked in interviews
  // type, timestamp, defaultPrevented
  // target, toElement, srcElement, currentTarget,
  // clientX, clientY, screenX, screenY
  // altkey, ctrlkey, shiftkey, keyCode

  // Event propogation -> event bubbling(false) , event capturing(true)
  // event bubbling -> goes from bottom to top (inner element -> outer element)
  // event capturing -> goes from top to bottom (outer element -> inner element)
  
  // event bubbling
  document.getElementById('images').addEventListener('click',function(e){
    // console.log("click inside the ul");
  },false)

  document.getElementById('owl').addEventListener('click',function(e){
    // console.log("owl got clicked");
  },false)
  // output :- 
  // any element other than owl image prints -> click inside the ul
  // when we click owl element -> owl got clicked -> click inside the ul

  // event capturing
  document.getElementById('images').addEventListener('click',function(e){
    // console.log("click inside the ul");
  },true)

  document.getElementById('owl').addEventListener('click',function(e){
    // console.log("owl got clicked");
  },true)
  // output :-
  // any element other than owl image prints -> click inside the ul
  // when we click owl element -> click inside the ul -> owl got clicked

  // stop propogation
  document.getElementById('owl').addEventListener('click',function(e){
    // console.log("owl got clicked");
    // e.stopPropagation();
  },true)

  // mini project -> remove the images when clicked
  document.getElementById('images').addEventListener('click',function(e){
    let removeIt = e.target.parentNode;
    console.log(removeIt);
    if(e.target.tagName === 'IMG'){
      removeIt.remove();
    }
  },false)
</script>
</html>
