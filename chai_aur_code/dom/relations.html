<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM - relations</title>
</head>
<body>
  <div class="parent">
    <div class="day">monday</div>
    <div class="day">tuesday</div>
    <div class="day">wednesday</div>
    <div class="day">thrusday</div>
  </div>
</body>
<script>
  const parent = document.querySelector('parent')
  console.log(parent);
  console.log(parent.children);
  console.log(parent.children[1]);

  // using loop
  for(let i=0; i< parent.children.length; i++){
    console.log(parent.children[i].innerHTML);
  }

  // changing the property of the accessed elements
  parent.children[i].style.color = "orange";

  // method for specifically accessing the first element
  console.log(parent.firstElementChild);
  // method for specifically accessing the last element
  console.log(parent.lastElementChild);
  
  // we can also access the first child of the parent by using querySelector which automaticallys gives the first element only
  const dayOne = document.querySelector('.day');

  // if we want to the know the parent of the child 
  console.log(dayOne.parentElement);
  // accessing the sibling -> next element
  console.log(dayOne.nextElementSibling);
  
  // child nodes
  console.log("NODES : ", parent.childNodes);
</script>
</html>
