<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Api request with chai aur code</title>
</head>
<body style="background-color: #212121; color: white;">
  <!-- Value	State	Description
  0	UNSENT	Client has been created. open() not called yet.
  1	OPENED	open() has been called.
  2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
  3	LOADING	Downloading; responseText holds partial data.
  4	DONE	The operation is complete. -->

  <!-- additional task -->
   <nav>
    <button id="button">show</button>
   </nav>
  <div class="card">
    <img src="hitesh_choudhary.png" alt="Avatar" style="width:50%">
    <div class="container">
      <h4 id="name"><b></b></h4>
      <p id="followers"></p>
    </div>
  </div>
</body>
<script>
  const requestUrl = 'https://api.github.com/users/hiteshchoudhary'
  const xhr = new XMLHttpRequest();
  // open is used to send the request , but open doesnt call itself
  xhr.open('GET',requestUrl);
  // how to track the continous changes ?
  // xhr.onreadystatechange = function(){
  //   console.log(xhr.readyState);
  //   if(xhr.readyState === 4){
  //     // xhr.readystate returns a response
  //     // so to console log it we have to convert it into object
  //     const data = JSON.parse(this.responseText)
  //     console.log(data.followers); //result will show undefined because returned data is string and we are accessing it like object
  //   }
  // }
  // we have to use send then open is called
  


  // additional task -> make a card and show followers
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      const data = JSON.parse(this.responseText) //object bana diye
      // console.log(typeof data.name);
      
      document.querySelector('#button').addEventListener('click',function(){
        document.querySelector('#name').innerHTML = `Name: ${data.name}`;
        document.querySelector('#followers').innerHTML = `Followers: ${data.followers}`;
      })
      
    }
  }
  xhr.send();
</script>
</html>
